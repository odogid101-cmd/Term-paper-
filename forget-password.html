<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Forgot Password</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body {
      font-family: Arial;
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .wrap {
      background:#1e293b;
      padding:24px;
      border-radius:10px;
      width:320px;
    }
    input, button {
      width:100%;
      padding:10px;
      margin:8px 0;
      border-radius:6px;
      border:none;
    }
    input { background:#0b1220; color:#fff; }
    button { background:#10b981; color:#062; cursor:pointer; }
    #msg { min-height:1.2em; color:#ffcccc; }
  </style>
</head>
<body>

<div class="wrap">
  <h2>Forgot Password</h2>

  <input type="email" id="email" placeholder="Enter your email">

  <button onclick="sendCode()">Send Reset Code</button>

  <hr>

  <input type="text" id="code" placeholder="Enter code (passXXXXXX)">
  <input type="password" id="newpass" placeholder="New password">

  <button onclick="resetPassword()">Reset Password</button>

  <p id="msg"></p>
</div>

<script>
const API = "https://term-paper-n4kl.onrender.com"; 

async function sendCode() {
  msg.innerText = "Sending...";
  try {
    const res = await fetch(API + "/request-reset", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        email: document.getElementById("email").value
      })
    });

    const data = await res.json();
    msg.innerText = data.message || data.error;

  } catch (e) {
    msg.innerText = "Network error";
  }
}

async function resetPassword() {
  msg.innerText = "Processing...";
  try {
    const res = await fetch(API + "/reset-password", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        email: document.getElementById("email").value,
        code: document.getElementById("code").value,
        new_password: document.getElementById("newpass").value
      })
    });

    const data = await res.json();

    if (res.ok) {
      msg.style.color = "#c9fdd1";
      msg.innerText = data.message;

      // redirect back to login
      setTimeout(()=>{
        window.location.href = "setup-signin.html";
      }, 1200);

    } else {
      msg.style.color = "#ffcccc";
      msg.innerText = data.error;
    }

  } catch (e) {
    msg.innerText = "Network error";
  }
}
</script>

</body>
</html>
