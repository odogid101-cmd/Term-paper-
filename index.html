<!DOCTYPE html>
<html>
<head>
<title>Auth</title>
<style>
body { background:#0f172a; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh;}
.box { background:#1e293b; padding:25px; border-radius:10px; width:300px;}
input, button { width:100%; padding:10px; margin:8px 0; border:none; border-radius:5px;}
button { background:#3b82f6; color:white;}
.toggle { text-align:center; cursor:pointer; color:#38bdf8;}
</style>
</head>

<body>

<div class="box">
<h2 id="title">Login</h2>

<input id="username" placeholder="Username" style="display:none;">
<input id="email" placeholder="Email" style="display:none;">

<input id="identifier" placeholder="Email or Username">
<input id="password" type="password" placeholder="Password">

<button onclick="submitForm()">Submit</button>
<div class="toggle" onclick="toggle()">Switch</div>
<p id="msg"></p>
</div>

<script>
let isLogin = true;
const API = "https://term-paper-n4kl.onrender.com";

function toggle(){
    isLogin = !isLogin;
    document.getElementById("title").innerText = isLogin ? "Login":"Register";
    document.getElementById("username").style.display = isLogin?"none":"block";
    document.getElementById("email").style.display = isLogin?"none":"block";
    document.getElementById("identifier").style.display = isLogin?"block":"none";
}

async function submitForm(){
    let url = isLogin?"/login":"/register";

    let data = isLogin?{
        identifier:identifier.value,
        password:password.value
    }:{
        username:username.value,
        email:email.value,
        password:password.value
    };

    let res = await fetch(API+url,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(data)
    });

    let r = await res.json();

    if(r.message){
        msg.innerText = r.message;

        if(!isLogin){
            setTimeout(()=>location.href="verify.html",1500);
        }

        if(isLogin){
            alert("Login success");
        }

    } else {
        msg.innerText = r.error;

       if(r.error === "Verify email first"){
        location.href="verify.html";
        }
        
    }
}
</script>

</body>
</html>
